[package]
name    = "gdpr-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
axum              = "0.8"
tokio             = { version = "1", features = ["full"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
anyhow            = "1"
thiserror         = "2"
uuid              = { version = "1", features = ["v4"] }
regex             = "1"

cloakpipe-core    = { git = "https://github.com/rohansx/cloakpipe", package = "cloakpipe-core", rev = "55a6b06c33578cee6d3b456ffbb8dd73e10750c4" }
kreuzberg         = { version = "4", features = ["pdf", "office", "tokio-runtime"] }

# cloakpipe-core requires rusqlite ^0.32, so ">=0.31" is used as a compromise
# to satisfy both the spec requirement (0.31 minimum) and the transitive dep (0.32).
rusqlite          = { version = "0.32", features = ["bundled"] }
clickhouse        = "0.12"
qdrant-client     = "1"

rmcp              = "0.1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus        = { version = "0.13", features = ["process"] }

[dev-dependencies]
tempfile   = "3"
tokio-test = "0.4"
