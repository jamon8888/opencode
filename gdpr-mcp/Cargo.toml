[package]
name    = "gdpr-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio             = { version = "1", features = ["full"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
anyhow            = "1"
thiserror         = "2"
uuid              = { version = "1", features = ["v4"] }

cloakpipe-core    = { git = "https://github.com/rohansx/cloakpipe", package = "cloakpipe-core", rev = "55a6b06c33578cee6d3b456ffbb8dd73e10750c4" }
kreuzberg         = { version = "4", features = ["pdf", "office", "tokio-runtime"] }
# The "ocr" kreuzberg feature is gated behind the `ocr` Cargo feature (requires cmake + Tesseract).
# On Windows native: cargo build --release --features ner
# In Docker (Linux): cargo build --release --features ner,ocr

# cloakpipe-core requires rusqlite ^0.32
rusqlite          = { version = "0.32", features = ["bundled"] }

rmcp              = { version = "0.1", features = ["server", "macros", "transport-io"] }
schemars          = "0.8"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus        = { version = "0.13", features = ["process"] }

# HTTP proxy (conversation anonymization path)
axum        = "0.8"

# L2 NER — Rust-native GLiNER inference, no Python sidecar
gline-rs             = "1"
unicode-segmentation = "1"
num_cpus             = "1"

# ClickHouse audit trail + proxy upstream forwarding
reqwest     = { version = "0.12", features = ["json", "stream"] }

[dev-dependencies]
tempfile   = "3"
tokio-test = "0.4"

# Reduce debug info to avoid LNK1318 PDB size limit on Windows MSVC.
# Full debuginfo with this many deps (reqwest+axum+gline-rs+kreuzberg) overflows the 4GB PDB limit.
[profile.dev]
debug = 1

[profile.test]
debug = 1

[features]
# Gate L2: build without --features ner avoids linking ONNX Runtime.
# The binary degrades gracefully to L1-only when model absent.
ner = []
# Gate Tesseract OCR: requires cmake + Tesseract installed (available in Docker, not on Windows native).
ocr = ["kreuzberg/ocr"]

# Public library items appear unused from the binary's reachability perspective.
# Suppress the spurious dead_code / unused_imports lints globally.
[lints.rust]
dead_code       = "allow"
unused_imports  = "allow"
