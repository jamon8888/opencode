name: GDPR Platform Security & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Security Audit (cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: gdpr-platform

      - name: Run cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: gdpr-platform/Cargo.toml

  build-check:
    name: Build Check (cargo check + cargo test)
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gdpr-platform/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Run cargo check (workspace)
        working-directory: gdpr-platform
        run: cargo check --workspace

      - name: Run cargo test (lib tests, workspace)
        working-directory: gdpr-platform
        run: cargo test --workspace --lib
